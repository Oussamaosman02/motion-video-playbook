<html lang="es" data-resolution="portrait">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Archivo"; src: url("assets/Archivo.ttf") format("truetype"); font-weight: 100 900; font-stretch: 62% 125%; }
      @font-face { font-family: "Silkscreen"; src: url("assets/Silkscreen-700.woff2") format("woff2"); font-weight: 700; }
      :root {
        --paper: #e7e6e2; --paper-hi: #f3f2ef; --ink: #161618; --night: #0d0d0f;
        --red: #e8382d; --red-deep: #7e140d; --cream: #f2efe6; --cyan: #5ff2e6; --blue: #2b3bff;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--night); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--night); font-family: "Archivo", sans-serif; }
      .scene { position: absolute; inset: 0; overflow: hidden; visibility: hidden; }
      .paper { background: radial-gradient(ellipse 75% 60% at 50% 46%, var(--paper-hi), var(--paper) 60%, #d4d3cf); }
      .night { background: radial-gradient(ellipse 80% 60% at 50% 50%, #151517, var(--night) 70%); }
      .full { position: absolute; inset: 0; }
      .tx { position: absolute; font-weight: 700; font-size: 48px; letter-spacing: -0.02em; line-height: 1.15; white-space: nowrap; }
      .tx.dark { color: var(--ink); }
      .tx.light { color: var(--cream); }
      .tx .w { display: inline-block; margin-right: 0.24em; }
      .cur { display: inline-block; width: 6px; height: 54px; background: currentColor; vertical-align: -8px; margin-left: 26px; }
      .ico { position: absolute; image-rendering: pixelated; }
      .ico img, img.ico { display: block; width: 100%; height: auto; image-rendering: pixelated; }
      .ring-item { position: absolute; width: 170px; height: 170px; margin: -85px 0 0 -85px; display: flex; align-items: center; justify-content: center; }
      .ring-item img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
      .big-letter { position: absolute; font-weight: 800; font-size: 64px; color: var(--ink); }
      .disp { font-weight: 860; font-stretch: 118%; text-transform: uppercase; line-height: 1; letter-spacing: -0.015em; }
      .px { font-family: "Silkscreen", monospace; letter-spacing: 0.08em; }
      svg { overflow: visible; }
      #grain { position: absolute; inset: -200px; background-image: url("assets/grain0.png"); background-size: 384px 384px; mix-blend-mode: overlay; opacity: 0.22; pointer-events: none; }
      #vig { position: absolute; inset: 0; background: radial-gradient(ellipse 72% 58% at 50% 48%, transparent 55%, rgba(0,0,0,0.38)); pointer-events: none; }
      #fade { position: absolute; inset: 0; background: #000; opacity: 0; }
    </style>
  </head>
