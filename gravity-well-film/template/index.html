    <script>
      const VO = 0.4;
      const W = [["¿Vendes",0.0],["un",0.383],["SaaS",0.476],["y",0.72],["mandas",0.789],["a",1.08],["todo",1.161],["el",1.393],["mundo",1.474],["a",1.707],["la",1.753],["misma",1.869],["landing?",2.229],["Error.",3.599],["Haz",4.621],["un",4.899],["quiz",5.05],["funnel.",5.306],["Uno,",6.223],["entre",6.699],["cinco",7.036],["y",7.407],["ocho",7.465],["preguntas",7.616],["para",8.127],["saber",8.313],["quién",8.638],["es",8.963],["y",9.125],["qué",9.23],["necesita.",9.358],["Dos,",10.437],["entre",10.995],["medias,",11.297],["cards",11.865],["con",12.167],["casos",12.33],["reales.",12.655],["Tres,",13.584],["le",14.315],["enseñas",14.42],["un",14.919],["resultado",15.035],["personalizado.",15.476],["Cuatro,",16.591],["una",17.194],["oferta",17.368],["a",17.659],["medida.",17.717],["Y",18.413],["cinco,",18.588],["un",19.214],["contador",19.354],["para",19.911],["que",20.12],["la",20.248],["canjee",20.387],["ya.",20.944],["Nada",22.012],["de",22.291],["mandar",22.384],["a",22.697],["todos",22.767],["a",23.115],["la",23.173],["misma",23.278],["landing.",23.58],["Así",24.334],["segmentas,",24.718],["educas",25.507],["y",26.25],["vendes.",26.413]];
      const w = (i) => W[i][1] + VO;
      const VO_END = 27.47, END = 31.5;
      const tl = gsap.timeline({ paused: true });
      const $ = (id) => document.getElementById(id);

      /* ---------- math ---------- */
      const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
      const sm = (a, b, t) => { const x = cl((t - a) / (b - a)); return x * x * (3 - 2 * x); };
      const lerp = (a, b, k) => a + (b - a) * k;
      const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
      const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
      const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
      const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
      const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
      const crs = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
      const nrm = (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
      // piecewise smooth keyframes: [[t, v], ...]; v may be a number or an array
      const key = (K, t) => {
        if (t <= K[0][0]) return K[0][1];
        for (let i = 0; i < K.length - 1; i++) {
          const [t0, a] = K[i], [t1, b] = K[i + 1];
          if (t <= t1) { const k = sm(t0, t1, t); return Array.isArray(a) ? a.map((v, j) => lerp(v, b[j], k)) : lerp(a, b, k); }
        }
        return K[K.length - 1][1];
      };

      /* ---------- world state (all keyed on word times) ---------- */
      const KD = [[0, 0], [4.7, 0], [5.8, 2.6], [13.9, 2.6], [14.6, 0.25], [16.9, 0.25], [17.6, 4.6], [22.3, 4.6], [22.9, 0], [24.6, 0], [25.3, 4.6], [27.4, 4.6], [28.4, 1.1], [31.5, 1.1]];
      const KS = [[0, 0], [4.7, 0], [5.8, 0.55], [13.9, 0.55], [14.6, 0], [16.9, 0], [17.6, 1.2], [22.3, 1.2], [22.9, 0], [24.6, 0], [25.3, 1.2], [27.4, 1.2], [28.4, 0.5]];
      const KR0 = [[0, 0.9], [16.9, 0.9], [17.6, 0.5], [22.3, 0.5], [22.9, 0.9], [24.6, 0.9], [25.3, 0.5], [27.4, 0.5], [28.4, 0.9]];
      const KT = [[22.3, 0], [22.9, 1], [24.5, 1], [25.1, 0]];
      // camera: [t, eye xyz, target xyz]
      const KC = [
        [0, [0, 1.5, -6.2, 0, 0.1, 1.2]], [3.9, [0, 2.1, -5.4, 0, 0, 0.6]],
        [4.6, [0, 2.4, -5.4, 0, -0.2, 0.4]], [5.9, [0, 4.4, -4.8, 0, -0.9, 0]],
        [6.7, [1.6, 4.0, -4.4, 0, -1.0, 0]], [10.6, [-1.6, 3.6, -4.2, 0, -1.1, 0]],
        [11.4, [0, 1.3, -4.9, 0, 0.45, 0]], [13.7, [0.5, 1.5, -4.5, 0, 0.45, 0]],
        [14.6, [0, 7.4, -0.9, 0, 0, 0]], [16.8, [0, 7.0, -0.9, 0, 0, 0]],
        [17.7, [0, 3.4, -4.5, 0, -0.9, 0]], [18.8, [0, 3.0, -4.0, 0, -0.9, 0]],
        [19.4, [1.2, 1.7, -4.3, 0, -0.4, 0]], [22.2, [-1.2, 1.6, -4.0, 0, -0.4, 0]],
        [22.9, [0, 1.9, -6.5, 0, 1.9, 4]], [24.5, [0, 1.9, -3.0, 0, 1.9, 6]],
        [25.2, [0, 2.6, -4.8, 0, -0.3, 0]], [27.3, [0.6, 2.4, -4.2, 0, -0.3, 0]],
        [28.4, [0, 5.4, -3.0, 0, -0.8, 0]], [31.5, [0, 5.0, -2.6, 0, -0.8, 0]],
      ];
      const LG = 6, RT = LG / Math.PI; // grid half-size, tunnel radius
      let S = {}; // per-frame derived state

      function frameState(t) {
        S.t = t; S.D = key(KD, t); S.Sw = key(KS, t); S.r0 = key(KR0, t); S.tun = key(KT, t);
        S.dune = 1 - sm(4.6, 5.6, t);
        S.spin = t > 16.9 ? (t - 16.9) * 0.35 : 0; // black-hole grid rotation
        const c = key(KC, t);
        const sh = t > 4.0 && t < 4.5 ? (1 - (t - 4.0) / 0.5) * 0.06 : 0; // ERROR shake
        const e = [c[0] + 0.04 * Math.sin(t * 0.7) + sh * Math.sin(t * 90), c[1] + 0.03 * Math.sin(t * 0.9 + 1) + sh * Math.cos(t * 77), c[2]];
        const tg = [c[3], c[4], c[5]];
        const f = nrm(sub(tg, e));
        const r = nrm(crs([0, 1, 0], f));
        const u = crs(f, r);
        S.e = e; S.f = f; S.r = r; S.u = u; S.foc = 1180;
      }
      function proj(p) {
        const d = sub(p, S.e), z = dot(d, S.f);
        if (z < 0.12) return null;
        return [540 + (S.foc * dot(d, S.r)) / z, 900 - (S.foc * dot(d, S.u)) / z, z];
      }
      // the surface: parameter (x, z) -> world point; flat dunes -> gravity well (swirled) -> tunnel
      function surf(x, z, lift = 0) {
        const r = Math.hypot(x, z);
        const th = (S.Sw * 1.1) / (r + 0.35) + S.spin;
        const c = Math.cos(th), s = Math.sin(th);
        const xr = x * c - z * s, zr = x * s + z * c;
        let y = -S.D / (1 + (r / S.r0) * (r / S.r0)) + lift;
        y += S.dune * 0.22 * Math.sin(x * 0.9 + 0.6) * Math.sin(z * 0.7 + 1.3);
        if (S.tun <= 0) return [xr, y, zr];
        const a = x / RT;
        const cy = [(RT - lift) * Math.sin(a), RT - (RT - lift) * Math.cos(a), z];
        return [lerp(xr, cy[0], S.tun), lerp(y, cy[1], S.tun), lerp(zr, cy[2], S.tun)];
      }

      /* ---------- drawing ---------- */
      const cv = $("fx"), ctx = cv.getContext("2d");
      const CREAM = "242,239,230", RED = "232,56,45";
      function gridLines(alpha, redCore) {
        const N = 34, M = 80, buckets = {};
        const push = (k, a, b) => { (buckets[k] = buckets[k] || []).push(a, b); };
        for (let dir = 0; dir < 2; dir++) {
          for (let i = 0; i <= N; i++) {
            const g = -LG + (2 * LG * i) / N;
            let prev = null, prevR = 0;
            for (let j = 0; j <= M; j++) {
              const h = -LG + (2 * LG * j) / M;
              const x = dir ? g : h, z = dir ? h : g;
              const p = proj(surf(x, z));
              if (p && prev) {
                const zz = (p[2] + prev[2]) / 2;
                let a = alpha * cl(1.25 - zz / 13) * cl(zz / 0.8);
                const rr = Math.hypot(x, z);
                const red = redCore > 0 && rr < 1.6 ? 1 : 0;
                if (red) a = Math.min(1, a * (1 + redCore * 1.6));
                const lv = Math.round(cl(a) * 10);
                if (lv > 0) push((red ? "r" : "c") + lv, prev, p);
              }
              prev = p;
            }
          }
        }
        ctx.lineWidth = 1.4;
        for (const k in buckets) {
          const lv = +k.slice(1) / 10, segs = buckets[k];
          ctx.strokeStyle = `rgba(${k[0] === "r" ? RED : CREAM},${lv})`;
          ctx.beginPath();
          for (let i = 0; i < segs.length; i += 2) { ctx.moveTo(segs[i][0], segs[i][1]); ctx.lineTo(segs[i + 1][0], segs[i + 1][1]); }
          ctx.stroke();
        }
      }
      function poly3(pts, color, width, close = false, glow = 0) {
        ctx.strokeStyle = color; ctx.lineWidth = width; ctx.beginPath();
        let on = false;
        for (const q of pts) { const p = proj(q); if (!p) { on = false; continue; } on ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); on = true; }
        if (close) ctx.closePath();
        if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
        ctx.stroke(); ctx.shadowBlur = 0;
      }
      function dot3(q, r, color, glow = 0) {
        const p = proj(q); if (!p) return null;
        const rr = Math.max(1.2, (r * S.foc) / p[2]);
        if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
        ctx.fillStyle = color; ctx.beginPath(); ctx.arc(p[0], p[1], rr, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
        return p;
      }
      const WCACHE = {};
      function cw(font, ch) { const k = font + ch; if (WCACHE[k] == null) { ctx.font = font; WCACHE[k] = ctx.measureText(ch).width; } return WCACHE[k]; }
      // polyline in parameter space -> 3D points + up vectors. mode "lie" = glued on the surface, "stand" = upright
      function pathOn(paramPts, mode, lift = 0.02) {
        const P = [], U = [];
        for (let i = 0; i < paramPts.length; i++) {
          const [x, z] = paramPts[i];
          const a = paramPts[Math.max(0, i - 1)], b = paramPts[Math.min(paramPts.length - 1, i + 1)];
          const p = surf(x, z, lift);
          P.push(p);

        const draw = (list) => list.forEach(([seg, r]) => {
          const hot = cl(1.3 - r);
          ctx.globalAlpha = a * (0.35 + 0.65 * hot);
          poly3(seg, hot > 0.5 ? "rgb(255,214,196)" : `rgb(${RED})`, 1.5 + hot * 2);
        });
        ctx.globalCompositeOperation = "lighter"; draw(back); ctx.globalCompositeOperation = "source-over";
        // horizon
        const hp = arcP(0.36, 0, Math.PI * 2, 60).map(([x, z]) => proj(surf(x, z, 0)));
        ctx.globalAlpha = a; ctx.fillStyle = "#000"; ctx.beginPath();
        hp.forEach((p, i) => p && (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.closePath();
        ctx.shadowColor = `rgb(${RED})`; ctx.shadowBlur = 60; ctx.fill(); ctx.shadowBlur = 0;
        ctx.strokeStyle = "rgba(255,200,180,0.9)"; ctx.lineWidth = 3; ctx.stroke(); ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "lighter"; draw(front); ctx.globalCompositeOperation = "source-over";
        // offer ring type
        if (t < 19.3) {
          const k = 1 - sm(18.9, 19.3, t);
          const r = 1.75;
          text3("OFERTA", pathOn(arcS(r, Math.PI * 0.93, Math.PI * 0.07), "lie", 0.08), { size: 0.66, align: "center", reveal: lerp(0, 7, sm(w(46), w(46) + 0.3, t)), color: `rgb(${CREAM})`, alpha: a * k, autoFlip: true, track: 1.12 });
          text3("A MEDIDA", pathOn(arcS(r, Math.PI * 1.07, Math.PI * 1.93), "lie", 0.08), { size: 0.66, align: "center", reveal: lerp(0, 9, sm(w(47), w(48) + 0.3, t)), color: `rgb(${RED})`, alpha: a * k, autoFlip: true, glow: 18, track: 1.12 });
          txt2("04", 540, 330, { size: 120, weight: 900, family: "Archivo", align: "center", alpha: sm(w(44), w(44) + 0.2, t) * k, color: `rgb(${RED})` });
          txt2("tu plan · tu caso · −30 % · ejemplo", 540, 400, { size: 24, align: "center", alpha: sm(w(48), w(48) + 0.3, t) * k * 0.7 });
        }
        // countdown riding a standing ring around the hole
        if (t > w(52) - 0.2 && t < 22.4) {
          const k = sm(w(52) - 0.15, w(52) + 0.25, t);
          const left = Math.max(0, 899 - Math.floor((t - w(52)) * 2));
          const mm = String(Math.floor(left / 60)).padStart(2, "0"), ss = String(left % 60).padStart(2, "0");
          const str = `QUEDAN 00:${mm}:${ss} · CANJÉALA YA · `;
          const shrink = 1 - sm(21.6, 22.35, t);
          const r = 1.3 * shrink + 0.05, rot = Math.PI * 1.15 - swirlAt(1.3) + (t - w(52)) * 0.5 + 2.4 * sm(21.4, 22.3, t);
          const ya = sm(w(57), w(57) + 0.1, t);
          text3(str, pathOn(arcP(r, rot, rot + Math.PI * 2, 180), "stand", 0.25 * shrink), { size: 0.3 * (0.4 + 0.6 * shrink), at: 0, color: ya ? `rgb(${RED})` : `rgb(${CREAM})`, alpha: a * k, backAlpha: 0.22, track: 1.02, glow: ya ? 14 : 0 });
          txt2(`${mm}:${ss}`, 540, 380, { size: 150, weight: 800, align: "center", alpha: k * shrink, color: ya ? `rgb(${RED})` : `rgb(${CREAM})` });
          txt2("05 · contador", 540, 230, { size: 24, align: "center", alpha: k * shrink * 0.7 });
        }
        // three orbits: segmentas / educas / vendes
        if (t > 24.9) {
          const col = Math.max(0, 1 - sm(26.95, 27.45, t));
          [["SEGMENTAS", 68, 1.95, 1.35, 0.5], ["EDUCAS", 69, 1.5, 0.55, -0.65], ["VENDES", 71, 1.45, 0.7, 0.3]].forEach(([s, wi, rr, hy, sp], n) => {
            const nx = n === 0 ? 69 : n === 1 ? 71 : null;
            const k = sm(w(wi) - 0.05, w(wi) + 0.2, t) * (nx ? 1 - (n === 1 ? 1 : 0.85) * sm(w(nx), w(nx) + 0.3, t) : 1) * (n === 0 ? 1 - sm(w(71), w(71) + 0.3, t) : 1); if (k <= 0) return;
            const r = rr * col + 0.02, rot = Math.PI * 1.5 + (t - w(wi)) * sp * 0.6 - swirlAt(r);
            ctx.globalAlpha = a * k * 0.5; poly3(arcP(r, 0, Math.PI * 2, 100).map(([x, z]) => surf(x, z, hy * col)), n === 2 ? `rgb(${RED})` : `rgba(${CREAM},0.5)`, 1.5, true); ctx.globalAlpha = 1;
            text3(s, pathOn(arcP(r, rot - Math.PI * 0.42, rot + Math.PI * 0.42, 80), "stand", hy * col), { size: (n === 2 ? 0.66 : 0.5) * (0.3 + 0.7 * col), align: "center", color: n === 2 ? `rgb(${RED})` : `rgb(${CREAM})`, alpha: a * k, backAlpha: 0.15, glow: n === 2 ? 16 : 0, track: 1.06 });
          });
        }
        return depthC;
      }
      // tunnel: the plane rolls into a tube; the same landing goes past, struck through, and breaks up
      function tunnel(t) {
        const a = sm(22.6, 23.0, t) * (1 - sm(24.5, 24.9, t));
        if (a <= 0) return;
        const z0 = -1.2;
        const path = pathOn(lineP(-3.2, 3.2, z0, z0, 60), "lie", 0.02);
        const br = sm(w(66), w(66) + 0.55, t);
        text3("LA MISMA LANDING", path, { size: 0.4, align: "center", color: `rgb(${CREAM})`, alpha: a * (1 - br), autoFlip: true });
        const st = sm(w(62), w(62) + 0.35, t);
        if (st > 0) { ctx.globalAlpha = a * (1 - br); poly3(lineP(-1.75, lerp(-1.75, 1.75, st), z0 + 0.15, z0 + 0.15, 40).map(([x, z]) => surf(x, z, 0.03)), `rgb(${RED})`, 6, false, 16); ctx.globalAlpha = 1; }
        if (br > 0) for (let i = 0; i < 140; i++) {
          const h1 = hash(i * 1.7), h2 = hash(i * 2.9), h3 = hash(i * 5.3);
          const x = -1.7 + 3.4 * h1, z = z0 + 0.25 * h2;
          const p = surf(x, z + br * (1 + 2 * h3), 0.02 + br * (0.3 + 1.4 * h2));
          ctx.globalAlpha = a * (1 - br) * 0.9 + 0.1 * a; dot3(p, 0.02, i % 5 ? `rgb(${CREAM})` : `rgb(${RED})`); ctx.globalAlpha = 1;
        }
        text3("nada de mandar a todos", pathOn(lineP(-1.5, 1.5, 3.4, 3.4, 30), "lie", 0.02), { size: 0.3, align: "center", color: `rgb(${RED})`, alpha: a * sm(w(58), w(58) + 0.3, t), autoFlip: true });
      }

      /* ---------- HUD text (deterministic per frame) ---------- */
      const SECS = [[0, "00 · LANDING"], [3.95, "!! · ERROR"], [5.4, "QUIZ FUNNEL"], [6.6, "01 · PREGUNTAS"], [10.8, "02 · CARDS"], [13.95, "03 · RESULTADO"], [16.95, "04 · OFERTA"], [18.8, "05 · CONTADOR"], [22.4, "XX · UNA LANDING"], [24.7, "→ COMPRA"]];
      let lastSec = "";
      function hud(t) {
        const s = Math.floor(t), cs = Math.floor((t - s) * 100);
        $("tc").textContent = `00:${String(s).padStart(2, "0")}.${String(cs).padStart(2, "0")}`;
        let sec = SECS[0][1]; for (const [a, b] of SECS) if (t >= a) sec = b;
        if (sec !== lastSec) { $("sec").textContent = sec; lastSec = sec; }
        $("tele").textContent = `prof  ${(-S.D).toFixed(2)}\ngiro  ${S.Sw.toFixed(2)}\ntubo  ${S.tun.toFixed(2)}`;
      }

      function F(t) {
        frameState(t);
        ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
        const g = ctx.createRadialGradient(540, 880, 50, 540, 900, 1300);
        g.addColorStop(0, "#121118"); g.addColorStop(1, "#050507");
        ctx.fillStyle = g; ctx.fillRect(0, 0, 1080, 1920);
        const top = sm(14.3, 14.7, t) * (1 - sm(16.9, 17.4, t));
        const gA = (0.55 + 0.2 * top) * (1 - 0.55 * sm(27.6, 28.4, t));
        const red = sm(16.95, 17.6, t) * (1 - sm(22.3, 22.6, t)) + sm(24.9, 25.4, t) * (1 - sm(27.3, 27.6, t));
        gridLines(gA, red * 0.9);
        ridgeText(t); landing(t); errorWord(t); funnelRing(t); topo(t); blob(t); scope(t); blackHole(t); tunnel(t);
        // glitch on ERROR and on the landing break-up
        const gl = (t > w(13) && t < w(13) + 0.32) || (t > w(66) && t < w(66) + 0.18);
        if (gl) {
          for (let k = 0; k < 9; k++) {
            const y = Math.floor(hash(k + Math.floor(t * 30) * 13) * 1800), h = 20 + Math.floor(hash(k * 3 + Math.floor(t * 30)) * 120);
            const dx = (hash(k * 7 + Math.floor(t * 30)) - 0.5) * 90;
            ctx.drawImage(cv, 0, y, 1080, h, dx, y, 1080, h);
          }
        }
        hud(t);
      }

      /* ---------- captions ---------- */
      const PH = [[0, 12], [13, 13], [14, 17], [18, 23], [24, 30], [31, 37], [38, 43], [44, 48], [49, 57], [58, 66], [67, 71]];
      const caps = $("caps");
      PH.forEach(([a, b], n) => {
        const d = document.createElement("div"); d.className = "cap"; d.id = `cap${n}`;
        for (let i = a; i <= b; i++) { const s = document.createElement("span"); s.className = "w"; s.id = `cw${i}`; s.textContent = W[i][0]; d.appendChild(s); }
        caps.appendChild(d);
        const t0 = w(a) - 0.05, t1 = n < PH.length - 1 ? w(PH[n + 1][0]) - 0.08 : VO_END + 0.1;
        tl.set(d, { opacity: 1 }, t0); tl.set(d, { opacity: 0 }, t1);
        for (let i = a; i <= b; i++) {
          tl.set(`#cw${i}`, { color: "#e8382d" }, w(i));
          tl.set(`#cw${i}`, { color: "#f2efe6" }, i < b ? w(i + 1) : w(i) + 0.45);
        }
      });

      /* ---------- engine + DOM timeline ---------- */
      const CLK = { v: 0 };
      tl.to(CLK, { v: END, duration: END, ease: "none", onUpdate: () => F(CLK.v) }, 0);
      const flash = (at, a = 0.85, d = 0.35) => tl.fromTo("#flash", { opacity: a }, { opacity: 0, duration: d, ease: "power2.out", immediateRender: false }, at);
      flash(w(13), 0.35, 0.25); flash(w(57), 0.5, 0.3); flash(27.45, 0.9, 0.5);
      tl.to("#hud-top, #sec, #tele", { opacity: 0, duration: 0.3 }, 27.3);
      tl.fromTo("#l-saas", { opacity: 0, y: 40, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, 27.6);
      tl.fromTo("#l-row", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 27.75);
      tl.fromTo("#l-cta", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 28.4);
      tl.to("#l-cta", { background: "#e8382d", duration: 0.2 }, 29.0);
      tl.fromTo("#l-sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4 }, 29.2);
      tl.fromTo("#l-foot", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 29.6);
      tl.to("#l-cta", { scale: 1.05, duration: 0.15, yoyo: true, repeat: 1 }, 30.2);
      F(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
