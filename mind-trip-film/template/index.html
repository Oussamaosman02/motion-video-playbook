<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Caveat"; src: url("assets/Caveat.ttf") format("truetype"); font-weight: 400 700; }
      @font-face { font-family: "Archivo"; src: url("assets/Archivo.ttf") format("truetype"); font-weight: 100 900; font-stretch: 62% 125%; }
      @font-face { font-family: "Silkscreen"; src: url("assets/Silkscreen-400.woff2") format("woff2"); font-weight: 400; }
      :root { --paper: #f2efe6; --ink: #2a0c09; --red: #e8382d; --deep: #7e140d; --gold: #f5c51b; --cream: #f6f1e4; --night: #120f26; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--paper); font-family: "Caveat", cursive; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .scene > svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
      /* handwritten caption, no box (the reference is wordless: text floats like a thought) */
      .cap { position: absolute; left: 70px; right: 70px; text-align: center; font-weight: 700; line-height: 1.0; }
      .cap .w { display: inline-block; clip-path: inset(-25% 100% -25% 0); }
      .cap .hl { color: var(--hl); }
      .cap .strike { background-image: linear-gradient(var(--hl), var(--hl)); background-repeat: no-repeat; background-position: 0 58%; background-size: 0% 7px; }
      /* little hand-drawn cards (questions, cases, results, offer) */
      .card { position: absolute; left: 0; top: 0; background: var(--cream); color: var(--ink); border: 4px solid var(--ink);
              border-radius: 225px 16px 205px 16px / 16px 205px 16px 225px; padding: 12px 28px 16px; font-size: 52px; font-weight: 700;
              white-space: nowrap; line-height: 1; box-shadow: 7px 8px 0 rgba(0, 0, 0, 0.28); }
      .card b { font-family: "Archivo"; font-weight: 800; font-stretch: 112%; font-size: 26px; letter-spacing: 2px; display: block; margin-bottom: 6px; color: var(--red); }
      .card i { font-style: normal; font-family: "Archivo"; font-weight: 700; font-size: 20px; letter-spacing: 1.5px; color: #8a7d72; margin-left: 10px; vertical-align: middle; }
      .grain { position: absolute; inset: 0; pointer-events: none; opacity: 0.5; mix-blend-mode: multiply; }
      #root[data-b="0"] .boil { filter: url(#b0); }
      #root[data-b="1"] .boil { filter: url(#b1); }
      #root[data-b="2"] .boil { filter: url(#b2); }
    </style>
  </head>
  <body>
    <div id="root" data-b="0" data-composition-id="main" data-start="0" data-duration="45" data-width="1080" data-height="1920">
      <svg width="0" height="0" style="position: absolute">
        <defs>
          <filter id="b0"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="1" /><feDisplacementMap in="SourceGraphic" scale="4" /></filter>
          <filter id="b1"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7" /><feDisplacementMap in="SourceGraphic" scale="4" /></filter>
          <filter id="b2"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="13" /><feDisplacementMap in="SourceGraphic" scale="4" /></filter>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14" result="g" /><feMerge><feMergeNode in="g" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
          <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" /><feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.4  0 0 0 0 0.35  0 0 0 0.22 0" /></filter>
          <pattern id="hatch" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(38)"><line x1="0" y1="0" x2="0" y2="11" stroke="#2a0c09" stroke-opacity="0.2" stroke-width="2.4" /></pattern>
          <pattern id="hatchL" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><line x1="0" y1="0" x2="0" y2="12" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2.2" /></pattern>
          <radialGradient id="nightG" cx="50%" cy="55%" r="75%"><stop offset="0" stop-color="#2d2160" /><stop offset="0.6" stop-color="#17123a" /><stop offset="1" stop-color="#0b0918" /></radialGradient>
          <linearGradient id="peachG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e98f7c" /><stop offset="1" stop-color="#fbe2b6" /></linearGradient>
          <linearGradient id="beamG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd27a" stop-opacity="0" /><stop offset="0.5" stop-color="#fff3d0" /><stop offset="1" stop-color="#ffd27a" stop-opacity="0" /></linearGradient>
        </defs>
      </svg>
      <audio id="mus" src="assets/music.mp3" data-start="0" data-duration="45" data-track-index="11" data-volume="0.85"></audio>
      <div id="sfx"></div>

      <section id="s1" class="scene clip" data-start="0" data-duration="6.6" data-track-index="1"></section>
      <section id="s2" class="scene clip" data-start="5.4" data-duration="5.4" data-track-index="2"></section>
      <section id="s3" class="scene clip" data-start="10.2" data-duration="5.6" data-track-index="1"></section>
      <section id="s4" class="scene clip" data-start="15.2" data-duration="4.6" data-track-index="2"></section>
      <section id="s5" class="scene clip" data-start="19.2" data-duration="5.6" data-track-index="1"></section>
      <section id="s6" class="scene clip" data-start="24.2" data-duration="3.6" data-track-index="2"></section>
      <section id="s7" class="scene clip" data-start="27.2" data-duration="6.6" data-track-index="1"></section>
      <section id="s8" class="scene clip" data-start="33.2" data-duration="4.4" data-track-index="2"></section>
      <section id="s9" class="scene clip" data-start="37.0" data-duration="4.6" data-track-index="1"></section>
      <section id="s10" class="scene clip" data-start="41.0" data-duration="4.0" data-track-index="2"></section>
      <div id="ui" class="scene" data-layout-ignore></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const END = 45;
      const tl = gsap.timeline({ paused: true });
      const $ = (id) => document.getElementById(id);
      const NS = "http://www.w3.org/2000/svg";
      const INK = "#2a0c09", RED = "#e8382d", GOLD = "#f5c51b", CREAM = "#f6f1e4";
      let uid = 0;
      // deterministic PRNG (no Math.random in HyperFrames)
      let seed = 20260922;
      const rnd = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

      // ---------- svg helpers ----------
      function el(parent, tag, attrs = {}, html) {
        const e = document.createElementNS(NS, tag);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        if (html) e.innerHTML = html;
        parent.appendChild(e);
        return e;
      }
      function stage(sec) { const s = el($(sec), "svg", { viewBox: "0 0 1080 1920" }); return s; }
      const paperBg = (s) => { el(s, "rect", { width: 1080, height: 1920, fill: "#f2efe6" }); el(s, "rect", { width: 1080, height: 1920, filter: "url(#noise)" }); };
      function nightBg(s, n = 140) {
        el(s, "rect", { width: 1080, height: 1920, fill: "url(#nightG)" });
        const g = el(s, "g");
        for (let i = 0; i < n; i++) { const r = rnd() * 2.6 + 0.8; el(g, "circle", { cx: rnd() * 1080, cy: rnd() * 1920, r, fill: "#fff", opacity: (0.25 + rnd() * 0.6).toFixed(2) }); }
        return g;
      }
      // draw a path like a pen: stroke-dashoffset from full length to 0
      function draw(p, t, dur, ease = "power1.inOut") {
        const L = Math.ceil(p.getTotalLength());
        p.setAttribute("stroke-dasharray", L + " " + L);
        tl.set(p, { attr: { "stroke-dashoffset": L } }, 0);
        tl.to(p, { attr: { "stroke-dashoffset": 0 }, duration: dur, ease }, t);
      }
      const popIn = (d, t, dur = 0.45) => tl.fromTo(d, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: dur, ease: "back.out(2.2)", transformOrigin: "50% 50%" }, t);
      const fade = (d, t, dur = 0.35) => tl.to(d, { opacity: 0, duration: dur }, t);
      const xfade = (sec, t, d = 0.5) => tl.fromTo($(sec), { opacity: 0 }, { opacity: 1, duration: d, ease: "sine.inOut" }, t);
      // circle wipe that opens a scene from a point (the "dive into the head" transition)
      const iris = (sec, x, y, t, d = 0.8) => tl.fromTo($(sec), { clipPath: `circle(0px at ${x}px ${y}px)` }, { clipPath: `circle(2300px at ${x}px ${y}px)`, duration: d, ease: "power2.in" }, t);

      let sN = 0;
      function sfx(file, t, vol = 0.45, dur = 1.2) {
        const a = document.createElement("audio");
        a.id = "sfx" + sN++;
        a.src = "assets/" + file;
        a.setAttribute("data-start", t.toFixed(2));
        a.setAttribute("data-duration", String(dur));
        a.setAttribute("data-track-index", String(20 + (sN % 6)));
        a.setAttribute("data-volume", String(vol));
        $("sfx").appendChild(a);
      }

      // ---------- captions: *gold/red word*, ~struck word~ ; written left to right ----------
      function caption(text, t0, t1, o = {}) {
        const { top = 300, size = 84, color = INK, hl = RED, strikeAt } = o;
        const d = document.createElement("div");
        d.id = "e" + uid++; d.className = "cap boil";
        Object.assign(d.style, { top: top + "px", fontSize: size + "px", color });
        d.style.setProperty("--hl", hl);
        if (color !== INK) d.style.textShadow = "0 4px 22px rgba(5,4,15,0.85)";
        d.innerHTML = text.split(" ").map((w) => {
          if (w.startsWith("*")) return `<span class="w hl">${w.replace(/\*/g, "")}</span>`;
          if (w.startsWith("~")) return `<span class="w"><span class="strike">${w.replace(/~/g, "")}</span></span>`;
          return `<span class="w">${w}</span>`;
        }).join(" ");
        $("ui").appendChild(d);
        tl.set(d, { opacity: 0 }, 0);
        tl.fromTo(d, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, t0);
        d.querySelectorAll(".w").forEach((w, i) => tl.to(w, { clipPath: "inset(-25% 0% -25% 0)", duration: 0.16, ease: "none" }, t0 + 0.1 + i * 0.07));
        if (strikeAt) d.querySelectorAll(".strike").forEach((s) => tl.to(s, { backgroundSize: "100% 7px", duration: 0.35, ease: "power2.out" }, strikeAt));
        sfx("pencil.mp3", t0 + 0.05, 0.28);
        if (t1) tl.to(d, { opacity: 0, y: -12, duration: 0.3 }, t1);
        return d;
      }
      // screen-space card
      function card(html, x, y, rot = -3) {
        const d = document.createElement("div");
        d.id = "e" + uid++; d.className = "card boil"; d.innerHTML = html;
        $("ui").appendChild(d);
        tl.set(d, { x, y, xPercent: -50, yPercent: -50, rotation: rot, opacity: 0 }, 0);
        return d;
      }

      // ---------- the mascot: a red block with a browser bar (your SaaS), drawn in SVG ----------
      function mascot(parent) {
        const g = el(parent, "g");
        const shadow = el(g, "ellipse", { cx: 0, cy: 6, rx: 170, ry: 14, fill: INK, opacity: 0.12 });
        const legs = [-112, -62, 38, 88].map((x) => {
          const l = el(g, "g");
          el(l, "rect", { x, y: -70, width: 26, height: 70, rx: 7, fill: RED, stroke: INK, "stroke-width": 6 });
          el(l, "rect", { x, y: -70, width: 26, height: 70, rx: 7, fill: "url(#hatch)" });
          return l;
        });
        const armL = el(g, "g"), armR = el(g, "g");
        el(armL, "rect", { x: -196, y: -176, width: 50, height: 50, rx: 8, fill: RED, stroke: INK, "stroke-width": 6 });
        el(armR, "rect", { x: 146, y: -176, width: 50, height: 50, rx: 8, fill: RED, stroke: INK, "stroke-width": 6 });
        el(g, "rect", { x: -155, y: -275, width: 310, height: 210, rx: 16, fill: RED, stroke: INK, "stroke-width": 7 });
        el(g, "rect", { x: -155, y: -275, width: 310, height: 210, rx: 16, fill: "url(#hatch)" });
        el(g, "path", { d: "M-152,-226 H152", stroke: INK, "stroke-width": 6 });
        [-124, -100, -76].forEach((x, i) => el(g, "circle", { cx: x, cy: -250, r: 7.5, fill: i === 0 ? GOLD : CREAM, stroke: INK, "stroke-width": 3 }));
        const eyes = el(g, "g");
        [-66, 42].forEach((x) => { el(eyes, "rect", { x, y: -186, width: 24, height: 44, rx: 9, fill: INK }); el(eyes, "circle", { cx: x + 8, cy: -174, r: 5, fill: "#fff" }); });
        const happy = el(g, "g", { opacity: 0 });
        [-54, 54].forEach((x) => el(happy, "path", { d: `M${x - 20},-150 L${x},-174 L${x + 20},-150`, fill: "none", stroke: INK, "stroke-width": 8, "stroke-linecap": "round", "stroke-linejoin": "round" }));
        return { g, legs, armL, armR, eyes, happy, shadow };
      }
      function walk(m, t0, dur) {
        const n = Math.round(dur / 0.22);
        m.legs.forEach((l, i) => tl.fromTo(l, { rotation: i % 2 ? 14 : -14 }, { rotation: i % 2 ? -14 : 14, duration: 0.22, ease: "sine.inOut", yoyo: true, repeat: n - 1, svgOrigin: `${[-99, -49, 51, 101][i]} -70` }, t0));
        tl.to(m.g.children, { y: -6, duration: 0.11, yoyo: true, repeat: n * 2 - 1, ease: "sine.inOut" }, t0);
        tl.to(m.legs.concat([m.armL, m.armR]), { rotation: 0, duration: 0.15 }, t0 + dur);
      }

      // =========================================================================
      // S1 · paper: the mascot walks in, stops, wonders  (0 – 6.6)
      // =========================================================================
      {
        const s = stage("s1");
        paperBg(s);
        const cam = el(s, "g");
        el(cam, "path", { d: "M60,1302 C300,1300 700,1305 1020,1301", stroke: INK, "stroke-opacity": 0.35, "stroke-width": 3, fill: "none", class: "boil" });
        const rip = el(cam, "g", { opacity: 0 });
        [180, 290, 420].forEach((r) => el(rip, "circle", { cx: 540, cy: 1130, r, fill: "none", stroke: INK, "stroke-opacity": 0.22, "stroke-width": 3, "stroke-dasharray": "6 10" }));
        const mw = el(cam, "g");
        const m = mascot(mw);
        m.g.setAttribute("class", "boil");
        tl.set(mw, { attr: { transform: "translate(-320,1300) scale(1.5)" } }, 0);
        tl.to(mw, { attr: { transform: "translate(540,1300) scale(1.5)" }, duration: 2.6, ease: "power1.out" }, 0.2);
        walk(m, 0.2, 2.6);
        // looks up at the question, then back
        tl.to(m.eyes, { y: -10, x: 6, duration: 0.25 }, 3.0);
        tl.to(m.eyes, { y: 0, x: 0, duration: 0.25 }, 4.2);
        // "Haz esto." : idea ripple
        tl.fromTo(rip, { opacity: 0, scale: 0.6, svgOrigin: "540 1130" }, { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out", svgOrigin: "540 1130" }, 4.0);
        tl.to(m.g, { scaleY: 0.92, scaleX: 1.05, duration: 0.12, yoyo: true, repeat: 1, svgOrigin: "0 0" }, 4.0);
        sfx("wiggle.mp3", 4.0, 0.35);
        // dive into the eye (left eye at mascot (-54,-164) * 1.5 + (540,1300) = (459,1054))
        tl.to(cam, { scale: 14, svgOrigin: "459 1054", duration: 1.2, ease: "power3.in" }, 5.1);
        caption("¿Quieres vender tu *SaaS* sin mandar a todo el mundo a la misma *landing?*", 0.5, 3.7, { top: 330, size: 86 });
        caption("Haz *esto.*", 3.9, 5.2, { top: 420, size: 150 });
      }

      // =========================================================================
      // S2 · inside the head: colour clouds + orbits; demo → Quiz Funnel  (5.4 – 10.8)
      // =========================================================================
      {
        const s = stage("s2");
        nightBg(s);
        iris("s2", 459, 1054, 5.5, 0.85);
        sfx("whoosh.mp3", 5.4, 0.5);
        const blobs = el(s, "g", { opacity: 0.85 });
        const cols = ["#f06b8b", "#8ad3a8", "#7fb6f0", "#c38bf0", "#f4a261", "#e8382d", "#f5c51b"];
        for (let i = 0; i < 16; i++) {
          const x = 540 + (rnd() - 0.5) * 620, y = 1080 + (rnd() - 0.5) * 760, r = 70 + rnd() * 120;
          const b = el(blobs, "circle", { cx: x, cy: y, r, fill: cols[i % cols.length], opacity: 0.55 });
          tl.fromTo(b, { scale: 0, svgOrigin: `${x} ${y}` }, { scale: 1, svgOrigin: `${x} ${y}`, duration: 1.2, ease: "back.out(1.6)" }, 5.7 + i * 0.06);
          tl.to(b, { attr: { cx: x + (rnd() - 0.5) * 80, cy: y + (rnd() - 0.5) * 80 }, duration: 4, ease: "sine.inOut" }, 6.6);
        }
        el(blobs, "rect", { x: 0, y: 500, width: 1080, height: 1200, fill: "url(#hatchL)" });
        const orb = el(s, "g", { class: "boil" });
        const oc = ["#f5c51b", "#7fe0d0", "#f06b8b", "#b49cff", "#7fb6f0"];
        oc.forEach((c, i) => {
          const e = el(orb, "ellipse", { cx: 540, cy: 1080, rx: 120 + i * 85, ry: 300 + i * 95, fill: "none", stroke: c, "stroke-width": 5 - i * 0.5, transform: `rotate(${-8 + i * 4} 540 1080)` });
          draw(e, 5.9 + i * 0.12, 1.4);
          // a tiny planet on each orbit
          const p = el(orb, "circle", { cx: 540 + 120 + i * 85, cy: 1080, r: 10 + (i % 3) * 4, fill: c, stroke: INK, "stroke-width": 3 });
          tl.fromTo(p, { rotation: i * 70, svgOrigin: "540 1080", opacity: 0 }, { rotation: i * 70 + 160 - i * 20, svgOrigin: "540 1080", opacity: 1, duration: 4.6, ease: "none" }, 6.0);
        });
        const star = el(s, "path", { d: "M540,1020 L552,1068 L600,1080 L552,1092 L540,1140 L528,1092 L480,1080 L528,1068 Z", fill: "#fff8d8", filter: "url(#glow)" });
        tl.fromTo(star, { scale: 0, svgOrigin: "540 1080" }, { scale: 1.2, svgOrigin: "540 1080", duration: 0.7, ease: "back.out(3)" }, 8.3);
        tl.to(star, { rotation: 90, svgOrigin: "540 1080", duration: 2.4, ease: "none" }, 8.3);
        sfx("chime.mp3", 8.3, 0.4);
        caption("En lugar de ~pedir~ ~una~ ~demo~ directamente…", 6.3, 10.2, { top: 300, size: 84, color: CREAM, hl: RED, strikeAt: 7.6 });
        caption("…crea un *Quiz* *Funnel.*", 8.2, 10.2, { top: 1500, size: 120, color: CREAM, hl: GOLD });
        tl.to($("s2"), { scale: 1.6, transformOrigin: "540px 1080px", duration: 0.7, ease: "power2.in" }, 10.1);
      }

      // =========================================================================
      // S3 · a neuron grows: 5–8 questions light at the dendrite tips  (10.2 – 15.8)
      // =========================================================================
      {
        const s = stage("s3");
        nightBg(s, 90);
        xfade("s3", 10.3, 0.5);
        sfx("whoosh.mp3", 10.2, 0.4);
        const n = el(s, "g", { class: "boil" });
        const SX = 540, SY = 1120;
        const tips = [];
        function branch(x, y, ang, len, w, depth, t) {
          let d = `M${x.toFixed(1)},${y.toFixed(1)}`;
          let cx = x, cy = y;
          const steps = 4;
          for (let i = 0; i < steps; i++) { ang += (rnd() - 0.5) * 0.5; cx += (Math.cos(ang) * len) / steps; cy += (Math.sin(ang) * len) / steps; d += ` L${cx.toFixed(1)},${cy.toFixed(1)}`; }
          const p = el(n, "path", { d, fill: "none", stroke: "#a98bff", "stroke-width": w, "stroke-linecap": "round", "stroke-linejoin": "round" });
          draw(p, t, 0.55, "power1.out");
          if (depth < 3) { const k = depth === 0 ? 2 : 2 + (rnd() < 0.4 ? 1 : 0); for (let j = 0; j < k; j++) branch(cx, cy, ang + (j - (k - 1) / 2) * 0.6, len * 0.68, w * 0.62, depth + 1, t + 0.45); }
          else tips.push([cx, cy, t + 0.55]);
        }
        for (let i = 0; i < 6; i++) branch(SX, SY, -Math.PI / 2 + (i - 2.5) * 0.55, 230, 16, 0, 10.6 + i * 0.05);
        const ax = el(n, "path", { d: `M${SX},${SY} C${SX - 20},${SY + 220} ${SX + 30},${SY + 420} ${SX - 10},${SY + 900}`, fill: "none", stroke: "#cdbcff", "stroke-width": 34, "stroke-linecap": "round" });
        draw(ax, 10.5, 1.0);
        el(n, "path", { d: `M${SX},${SY} C${SX - 20},${SY + 220} ${SX + 30},${SY + 420} ${SX - 10},${SY + 900}`, fill: "none", stroke: "url(#hatchL)", "stroke-width": 34 });
        const soma = el(n, "g");
        el(soma, "circle", { cx: SX, cy: SY, r: 70, fill: "#5b3fc4", stroke: "#cdbcff", "stroke-width": 8 });
        el(soma, "circle", { cx: SX, cy: SY, r: 26, fill: GOLD, filter: "url(#glow)" });
        popIn(soma, 10.4, 0.6);
        // tip sparks
        tips.forEach(([x, y, t]) => { const c = el(s, "circle", { cx: x, cy: y, r: 7, fill: "#fff3c4", filter: "url(#glow)" }); tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.2 }, t); });
        // axon pulse
        const pulse = el(s, "circle", { cx: SX, cy: SY, r: 16, fill: GOLD, filter: "url(#glow)", opacity: 0 });
        tl.set(pulse, { opacity: 1 }, 13.9);
        tl.to(pulse, { attr: { cy: SY + 760, cx: SX + 10 }, duration: 1.2, ease: "power1.in" }, 13.9);
        const qs = [
          ["PREGUNTA 1/6", "¿Quién eres?", 300, 820, -4],
          ["PREGUNTA 2/6", "¿Qué quieres conseguir?", 720, 960, 3],

        caption("Primero, *5* *a* *8* *preguntas.*", 10.7, 15.3, { top: 300, size: 92, color: CREAM, hl: GOLD });
        caption("quién es · qué quiere · su problema", 11.6, 15.3, { top: 415, size: 60, color: "#cdbcff", hl: GOLD });
      }

      // =========================================================================
      // S4 · DNA helix with cards between the questions  (15.2 – 19.8)
      // =========================================================================
      {
        const s = stage("s4");
        nightBg(s, 80);
        xfade("s4", 15.3, 0.45);
        sfx("whoosh.mp3", 15.2, 0.35);
        const H = el(s, "g", { class: "boil" });
        const Y = 1100, A = 170, WL = 400;
        const rung = ["#e8382d", "#f5c51b", "#7fe0d0", "#7fb6f0", "#b49cff", "#f06b8b"];
        let pa = "", pb = "";
        for (let x = -440; x <= 1900; x += 8) { const a = (x / WL) * 2 * Math.PI; pa += (x === -440 ? "M" : "L") + x + "," + (Y + A * Math.sin(a)).toFixed(1); pb += (x === -440 ? "M" : "L") + x + "," + (Y - A * Math.sin(a)).toFixed(1); }
        for (let x = -440, i = 0; x <= 1900; x += 25, i++) { const a = (x / WL) * 2 * Math.PI; el(H, "line", { x1: x, y1: Y + A * Math.sin(a), x2: x, y2: Y - A * Math.sin(a), stroke: rung[i % 6], "stroke-width": 9, "stroke-linecap": "round", opacity: 0.9 }); }
        el(H, "path", { d: pa, fill: "none", stroke: "#b49cff", "stroke-width": 18, "stroke-linecap": "round" });
        el(H, "path", { d: pb, fill: "none", stroke: "#e8382d", "stroke-width": 18, "stroke-linecap": "round" });
        tl.fromTo(H, { x: 0 }, { x: -800, duration: 4.6, ease: "none" }, 15.2);
        tl.fromTo(H, { opacity: 0, scaleY: 0, svgOrigin: `540 ${Y}` }, { opacity: 1, scaleY: 1, svgOrigin: `540 ${Y}`, duration: 0.6, ease: "back.out(1.6)" }, 15.3);

          ["CASO REAL <i>EJEMPLO</i>", "Ana dobló sus demos", 300, 820, -4],
          ["DATO <i>EJEMPLO</i>", "7 de 10 no piden demo", 760, 900, 3],
          ["RESULTADO <i>EJEMPLO</i>", "+40% leads cualificados", 320, 1380, 2],
          ["CONSEJO", "Empieza por el dolor", 760, 1460, -3],
        ];
        cs.forEach(([k, q, x, y, r], i) => { const c = card(`<b>${k}</b>${q}`, x, y, r); popIn(c, 17.0 + i * 0.4); sfx("pop.mp3", 17.0 + i * 0.4, 0.4); fade(c, 19.3); });
        caption("Pero no hagas *solo* preguntas.", 15.5, 16.9, { top: 330, size: 96, color: CREAM, hl: GOLD });
        caption("Entre medias: *cards* con casos, datos y consejos.", 17.0, 19.3, { top: 300, size: 80, color: CREAM, hl: GOLD });
        caption("“vale, esto tiene sentido”", 18.2, 19.3, { top: 1640, size: 76, color: "#cdbcff", hl: GOLD });

      // =========================================================================
      // S5 · prism: one white beam (everyone) splits into results  (19.2 – 24.8)
      // =========================================================================
      {
        const s = stage("s5");

        const rc = ["#e8382d", "#f4892b", "#f5c51b", "#5cc16b", "#4a8fe8", "#8a5cf0"];
        rc.forEach((c, i) => {
          const y0 = 1000 + i * 4, y1 = 920 + i * 92;
          el(bands, "polygon", { points: `604,${y0} 604,${y0 + 4} 1120,${y1 + 92} 1120,${y1}`, fill: c });

        tl.fromTo(bands, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 1.1, ease: "power2.out" }, 20.6);

        el(pr, "polygon", { points: "540,840 400,1110 680,1110", fill: "#d9f2ff", "fill-opacity": 0.16, stroke: "#eef8ff", "stroke-width": 6, "stroke-linejoin": "round" });
        el(pr, "polygon", { points: "540,840 560,1110 680,1110", fill: "#ffffff", "fill-opacity": 0.12 });
        el(pr, "path", { d: "M540,840 L560,1110", stroke: "#eef8ff", "stroke-width": 3, opacity: 0.7 });
        popIn(pr, 19.4, 0.6);
        sfx("chime.mp3", 20.6, 0.35);
        const rs = [
          ["RESULTADO A", "Fundador técnico", 330, 1560, -3],
          ["RESULTADO B", "Equipo de ventas", 740, 1660, 2],
          ["RESULTADO C", "SaaS en crecimiento", 380, 1770, -1],
        ];
        rs.forEach(([k, q, x, y, r], i) => { const c = card(`<b>${k}</b>${q}`, x, y, r); popIn(c, 22.0 + i * 0.45); sfx("pop.mp3", 22.0 + i * 0.45, 0.4); fade(c, 24.3); });
        caption("Después, según sus respuestas…", 19.6, 24.3, { top: 300, size: 84, color: CREAM, hl: GOLD });
        caption("…le muestras un resultado *personalizado.*", 21.0, 24.3, { top: 420, size: 84, color: CREAM, hl: GOLD });

      // =========================================================================

      // =========================================================================
      {
        const s = stage("s6");

        sfx("whoosh.mp3", 24.2, 0.35);
        const CX = 540, CY = 1120;
        const fl = el(s, "g");
        const pet = el(fl, "g", { class: "boil" });
        for (let i = 0; i < 34; i++) {
          const a = (i / 34) * 360;
          const p = el(pet, "path", { d: `M${CX},${CY - 200} C${CX - 46},${CY - 260} ${CX - 30},${CY - 360} ${CX},${CY - 410} C${CX + 30},${CY - 360} ${CX + 46},${CY - 260} ${CX},${CY - 200} Z`, fill: i % 2 ? "#f2b91c" : "#f7cf3a", stroke: INK, "stroke-width": 4, transform: `rotate(${a} ${CX} ${CY})` });

          const c = el(seeds, "circle", { cx: CX + r * Math.cos(a), cy: CY + r * Math.sin(a), r: 6, fill: k % 3 ? "#c98b2b" : "#f5c51b" });

      // =========================================================================
      {
        const s = stage("s7");
        nightBg(s, 160);
        xfade("s7", 27.3, 0.45);

        const CX = 540, CY = 1120;
        const gx = el(s, "g", { transform: `translate(${CX} ${CY}) scale(1 0.42) rotate(0)` });
        const spin = el(gx, "g");
        for (let i = 0; i < 520; i++) {
          const arm = i % 3, t = rnd(), r = 40 + t * 480, a = arm * 2.094 + t * 4.2 + (rnd() - 0.5) * 0.7;
          el(spin, "circle", { cx: r * Math.cos(a), cy: r * Math.sin(a), r: 2 + rnd() * 3.5, fill: ["#f4a261", "#f5c51b", "#f06b8b", "#fff1d6"][i % 4], opacity: (0.4 + rnd() * 0.6).toFixed(2) });
        }
        el(spin, "circle", { cx: 0, cy: 0, r: 70, fill: "#ffd9a8", filter: "url(#glow)", opacity: 0.8 });
        tl.fromTo(spin, { rotation: 0 }, { rotation: 300, duration: 3.0, ease: "power2.in" }, 27.2);
        tl.to(spin, { scale: 0.18, opacity: 0, duration: 1.0, ease: "power3.in" }, 28.6);
        // black hole
        const bh = el(s, "g", { opacity: 0 });
        const back = el(bh, "g", { transform: `translate(${CX} ${CY}) rotate(-14)` });
        ["#f06b8b", "#f4892b", "#f5c51b", "#fff1d6"].forEach((c, i) => el(back, "path", { d: `M${-300 + i * 30},0 A${300 - i * 30},${300 - i * 30} 0 0 1 ${300 - i * 30},0`, fill: "none", stroke: c, "stroke-width": 26, opacity: 0.9 }));
        const disc = el(bh, "g", { transform: `translate(${CX} ${CY}) rotate(-14) scale(1 0.3)` });
        ["#b44ac9", "#f06b8b", "#f4892b", "#f5c51b", "#fff1d6"].forEach((c, i) => el(disc, "circle", { r: 470 - i * 55, fill: "none", stroke: c, "stroke-width": 50 }));
        el(disc, "circle", { r: 440, fill: "url(#hatchL)" });
        el(bh, "circle", { cx: CX, cy: CY, r: 190, fill: "#07060f", stroke: "#fff1d6", "stroke-width": 6 });
        const front = el(bh, "g", { transform: `translate(${CX} ${CY}) rotate(-14) scale(1 0.3)` });
        ["#f06b8b", "#f4892b", "#f5c51b"].forEach((c, i) => el(front, "path", { d: `M${-(450 - i * 60)},0 A${450 - i * 60},${450 - i * 60} 0 0 0 ${450 - i * 60},0`, fill: "none", stroke: c, "stroke-width": 50 }));
        const label = el(bh, "text", { x: CX, y: CY + 14, "text-anchor": "middle", "font-family": "Archivo", "font-weight": 800, "font-size": 34, "letter-spacing": 3, fill: CREAM }, "TU PRODUCTO");
        tl.fromTo(bh, { opacity: 0, scale: 0.2, svgOrigin: `${CX} ${CY}` }, { opacity: 1, scale: 1, svgOrigin: `${CX} ${CY}`, duration: 0.7, ease: "back.out(1.8)" }, 29.1);
        tl.to(disc, { rotation: 0, duration: 0 }, 29.1);
        sfx("impact.mp3", 29.1, 0.5, 2);
        // cards spiral into the hole
        const fall = [
          ["POR QUÉ ENCAJA", "Tu caso, tu solución", -280, 700],
          ["OFERTA ESPECÍFICA <i>EJEMPLO</i>", "−20% plan anual", 1340, 820],
          ["TIEMPO LIMITADO", "Caduca en 15 min", 540, 2200],
        ];
        fall.forEach(([k, q, x0, y0], i) => {
          const c = card(`<b>${k}</b>${q}`, x0, y0, i % 2 ? 4 : -4);
          const t0 = 29.4 + i * 0.4;
          tl.set(c, { opacity: 1 }, t0);
          sfx("pop.mp3", t0, 0.35);
          const mx = i === 1 ? 760 : 320, my = i === 2 ? 1500 : 820;
          tl.to(c, { keyframes: [{ x: mx, y: my, duration: 0.7, ease: "power2.out" }, { x: CX, y: CY, scale: 0.05, rotation: 200, opacity: 0, duration: 0.7, ease: "power2.in", delay: 0.25 }] }, t0);
        });
        // countdown rings
        const rings = el(s, "g", { class: "boil" });
        ["#f6f1e4", "#f5c51b", "#f06b8b", "#b49cff", "#6d4bd8"].forEach((c, i) => {
          const r = el(rings, "circle", { cx: CX, cy: CY, r: 470 - i * 70, fill: "none", stroke: c, "stroke-width": 50, opacity: 0.95 });
          tl.fromTo(r, { scale: 0, svgOrigin: `${CX} ${CY}` }, { scale: 1, svgOrigin: `${CX} ${CY}`, duration: 0.6, ease: "back.out(1.6)" }, 31.6 + i * 0.07);
        });
        tl.set(label, { opacity: 0 }, 31.6);
        tl.to(bh, { opacity: 0, scale: 0.6, svgOrigin: `${CX} ${CY}`, duration: 0.4 }, 31.5);
        const tm = document.createElement("div");
        tm.id = "timer";
        Object.assign(tm.style, { position: "absolute", left: "0", right: "0", top: CY - 110 + "px", textAlign: "center", color: CREAM, fontFamily: "Archivo", fontWeight: 800, fontStretch: "105%", fontSize: "118px", lineHeight: 1 });
        tm.innerHTML = `<div style="font-size:26px;letter-spacing:4px;color:#f5c51b;margin-bottom:10px">OFERTA · EJEMPLO</div>` + ["14:59", "14:58", "14:57"].map((v, i) => `<span class="tv" style="display:${i ? "none" : "inline"}">${v}</span>`).join("");
        $("ui").appendChild(tm);
        tl.set(tm, { opacity: 0 }, 0);
        popIn(tm, 31.9);
        const tv = tm.querySelectorAll(".tv");
        [32.6, 33.3].forEach((t, i) => { tl.set(tv[i], { display: "none" }, t); tl.set(tv[i + 1], { display: "inline" }, t); sfx("tick.mp3", t, 0.4, 0.5); });
        sfx("tick.mp3", 31.9, 0.4, 0.5);
        fade(tm, 33.5, 0.25);
        tl.to(rings, { scale: 3, opacity: 0, svgOrigin: `${CX} ${CY}`, duration: 0.5, ease: "power2.in" }, 33.3);
        caption("Las últimas cards lo llevan hacia *tu* *producto*", 27.6, 31.4, { top: 300, size: 86, color: CREAM, hl: GOLD });
        caption("por qué encaja · oferta específica · contador", 29.5, 31.4, { top: 1660, size: 58, color: "#cdbcff", hl: GOLD });
        caption("…y un *contador* para canjearla.", 31.5, 33.4, { top: 330, size: 88, color: CREAM, hl: GOLD });
      }

      // =========================================================================
      // S8 · a beam shoots up: "así no solo captas el lead"  (33.2 – 37.6)
      // =========================================================================
      {
        const s = stage("s8");
        el(s, "rect", { width: 1080, height: 1920, fill: "#0b0918" });
        xfade("s8", 33.3, 0.35);
        sfx("whoosh.mp3", 33.3, 0.45);
        const streaks = el(s, "g");
        for (let i = 0; i < 70; i++) { const x = rnd() * 1080, y = rnd() * 1920, h = 30 + rnd() * 120; el(streaks, "rect", { x, y, width: 3, height: h, fill: "#fff", opacity: (0.15 + rnd() * 0.45).toFixed(2) }); }
        tl.fromTo(streaks, { y: -400 }, { y: 600, duration: 4.4, ease: "none" }, 33.2);
        const bm = el(s, "rect", { x: 500, y: 600, width: 80, height: 1400, fill: "url(#beamG)", filter: "url(#glow)" });
        el(s, "rect", { x: 530, y: 600, width: 20, height: 1400, fill: "#fff8e0" });
        const head = el(s, "circle", { cx: 540, cy: 600, r: 34, fill: "#fff8e0", filter: "url(#glow)" });
        const grp = [bm, bm.nextSibling, head];
        tl.fromTo(grp, { y: 1400 }, { y: 0, duration: 1.4, ease: "power2.out" }, 33.6);

        fade(lead, 37.0);

      }

      // =========================================================================
      // S9 · earthrise over the moon: segment, educate, sell  (37.0 – 41.6)
      // =========================================================================
      {
        const s = stage("s9");
        nightBg(s, 120);
        xfade("s9", 37.1, 0.4);
        sfx("whoosh.mp3", 37.0, 0.35);
        const earth = el(s, "g", { class: "boil" });
        const EX = 540, EY = 1300;
        el(earth, "circle", { cx: EX, cy: EY, r: 230, fill: "#3b7ddd", stroke: INK, "stroke-width": 7 });
        el(earth, "path", { d: `M${EX - 170},${EY - 120} C${EX - 90},${EY - 170} ${EX - 30},${EY - 90} ${EX - 70},${EY - 30} C${EX - 120},${EY + 30} ${EX - 60},${EY + 120} ${EX - 140},${EY + 140} C${EX - 220},${EY + 60} ${EX - 220},${EY - 60} ${EX - 170},${EY - 120} Z`, fill: "#5cc16b", stroke: INK, "stroke-width": 5 });
        el(earth, "path", { d: `M${EX + 60},${EY - 200} C${EX + 160},${EY - 170} ${EX + 220},${EY - 60} ${EX + 180},${EY + 40} C${EX + 120},${EY + 10} ${EX + 80},${EY - 60} ${EX + 40},${EY - 120} Z`, fill: "#f5c51b", stroke: INK, "stroke-width": 5 });
        el(earth, "path", { d: `M${EX + 20},${EY + 40} c40,-30 90,0 60,40 c-30,40 -100,10 -70,-30`, fill: "none", stroke: "#fff", "stroke-width": 9, "stroke-linecap": "round" });
        el(earth, "circle", { cx: EX, cy: EY, r: 230, fill: "url(#hatch)" });
        tl.fromTo(earth, { y: 520 }, { y: 0, duration: 3.6, ease: "power2.out" }, 37.0);
        const moon = el(s, "g");
        el(moon, "ellipse", { cx: 540, cy: 2050, rx: 1150, ry: 560, fill: "#a9a6b6", stroke: INK, "stroke-width": 7 });
        el(moon, "ellipse", { cx: 540, cy: 2050, rx: 1150, ry: 560, fill: "url(#hatch)" });
        for (let i = 0; i < 14; i++) { const x = rnd() * 1080, y = 1560 + rnd() * 300, r = 18 + rnd() * 46; el(moon, "ellipse", { cx: x, cy: y, rx: r, ry: r * 0.38, fill: "#8d8a9c", stroke: INK, "stroke-opacity": 0.4, "stroke-width": 3 }); }

      // S10 · back on paper: the mascot is happy + brand  (41.0 – 45)
      // =========================================================================
      {
        const s = stage("s10");
        paperBg(s);
        iris("s10", 540, 1300, 41.0, 0.7);
        sfx("whoosh.mp3", 40.9, 0.4);
        const rays = el(s, "g", { opacity: 0.5 });
        for (let i = 0; i < 48; i++) { const a = (i / 48) * Math.PI * 2, r0 = 380 + rnd() * 80, r1 = 700 + rnd() * 400; el(rays, "line", { x1: 540 + r0 * Math.cos(a), y1: 1000 + r0 * Math.sin(a), x2: 540 + r1 * Math.cos(a), y2: 1000 + r1 * Math.sin(a), stroke: INK, "stroke-opacity": 0.35, "stroke-width": 2 }); }
        [300, 520].forEach((r) => el(rays, "circle", { cx: 540, cy: 1000, r, fill: "none", stroke: INK, "stroke-opacity": 0.25, "stroke-width": 2, "stroke-dasharray": "5 9" }));
        tl.fromTo(rays, { scale: 0.7, svgOrigin: "540 1000" }, { scale: 1.08, svgOrigin: "540 1000", duration: 4, ease: "power1.out" }, 41.0);
        el(s, "path", { d: "M60,1302 C300,1300 700,1305 1020,1301", stroke: INK, "stroke-opacity": 0.35, "stroke-width": 3, fill: "none" });
        const mo = el(s, "g", { transform: "translate(540,1300) scale(1.9)" });
        const mw = el(mo, "g");

        m.g.setAttribute("class", "boil");

        tl.set(m.happy, { opacity: 1 }, 41.0);
        tl.fromTo(mw, { scale: 1.4, svgOrigin: "0 0" }, { scale: 1, svgOrigin: "0 0", duration: 0.9, ease: "power2.out" }, 41.0);
        tl.to(m.armL, { rotation: 35, svgOrigin: "-146 -150", duration: 0.25, yoyo: true, repeat: 5, ease: "sine.inOut" }, 41.6);
        tl.to(m.armR, { rotation: -35, svgOrigin: "146 -150", duration: 0.25, yoyo: true, repeat: 5, ease: "sine.inOut" }, 41.6);

        const logo = document.createElement("div");
        logo.id = "logo";
        logo.innerHTML = '<span style="font-family:Archivo;font-weight:860;font-stretch:118%;font-size:76px;text-transform:uppercase">SaaS</span><span style="font-family:Silkscreen;font-size:32px;background:#e8382d;color:#f2efe6;padding:8px 12px 4px;border-radius:8px;box-shadow:4px 4px 0 #7e140d">IN</span><span style="font-family:Archivo;font-weight:860;font-stretch:118%;font-size:76px;text-transform:uppercase">House</span>';
        Object.assign(logo.style, { position: "absolute", left: "0", right: "0", top: "1400px", display: "flex", justifyContent: "center", alignItems: "center", gap: "14px", color: INK });
        $("ui").appendChild(logo);
        tl.set(logo, { opacity: 0 }, 0);
        popIn(logo, 42.2); sfx("chime.mp3", 42.2, 0.45);
        caption("Quiz Funnels que *venden.*", 42.6, null, { top: 1530, size: 84, color: INK, hl: RED });
        caption("Segmenta. Educa. *Vende.*", 41.4, null, { top: 330, size: 100, color: INK, hl: RED });
      }

      // ---------- line boil: swap displacement seeds at 8 fps ----------
      for (let k = 0; k * 0.125 < END; k++) tl.set($("root"), { attr: { "data-b": String(k % 3) } }, k * 0.125);
      tl.set({}, {}, END);
      window.__timelines["main"] = tl;
    </script>
